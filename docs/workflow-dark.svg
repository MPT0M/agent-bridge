<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 690" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5">
  <!-- Agent Bridge MCP — Typical Workflow (dark theme, transparent background)
       Driver = cyan, Navigator = amber, Bridge = neutral.
       Solid arrow = MCP write call; dashed arrow out of Bridge = read_bridge; loop = local work. -->
  <defs>
    <marker id="a-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 z" fill="#00E5FF"/>
    </marker>
    <marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 z" fill="#FFB800"/>
    </marker>
    <marker id="a-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8A8A95"/>
    </marker>
  </defs>

  <!-- Lifelines -->
  <g stroke="#4A4A55" stroke-width="1.5" stroke-dasharray="4 4">
    <line x1="130" y1="60" x2="130" y2="590"/>
    <line x1="540" y1="60" x2="540" y2="590"/>
    <line x1="950" y1="60" x2="950" y2="590"/>
  </g>

  <!-- Actor boxes (top) -->
  <g stroke-width="1.5">
    <rect x="25" y="16" width="210" height="44" rx="6" fill="#1A1A1F" stroke="#00E5FF"/>
    <rect x="390" y="16" width="300" height="44" rx="6" fill="#1A1A1F" stroke="#4A4A55"/>
    <rect x="845" y="16" width="210" height="44" rx="6" fill="#1A1A1F" stroke="#FFB800"/>
  </g>
  <g font-size="13" fill="#FFFFFF">
    <text x="52" y="43">Claude Code <tspan fill="#00E5FF">(Driver)</tspan></text>
    <text x="411" y="43">Agent Bridge MCP <tspan fill="#8A8A95">(.agent-bridge/)</tspan></text>
    <text x="860" y="43">Antigravity <tspan fill="#FFB800">(Navigator)</tspan></text>
  </g>

  <!-- Actor boxes (bottom) -->
  <g stroke-width="1.5">
    <rect x="25" y="590" width="210" height="44" rx="6" fill="#1A1A1F" stroke="#00E5FF"/>
    <rect x="390" y="590" width="300" height="44" rx="6" fill="#1A1A1F" stroke="#4A4A55"/>
    <rect x="845" y="590" width="210" height="44" rx="6" fill="#1A1A1F" stroke="#FFB800"/>
  </g>
  <g font-size="13" fill="#FFFFFF">
    <text x="52" y="617">Claude Code <tspan fill="#00E5FF">(Driver)</tspan></text>
    <text x="411" y="617">Agent Bridge MCP <tspan fill="#8A8A95">(.agent-bridge/)</tspan></text>
    <text x="860" y="617">Antigravity <tspan fill="#FFB800">(Navigator)</tspan></text>
  </g>

  <!-- 1. Driver → Bridge: post_proposal -->
  <line x1="141" y1="104" x2="537" y2="104" stroke="#00E5FF" stroke-width="1.5" marker-end="url(#a-cyan)"/>
  <text x="176" y="96" fill="#FFFFFF">post_proposal<tspan fill="#8A8A95">("Adopt BM25+ tokenization", ...)</tspan></text>

  <!-- 2. Nav reads: read_bridge -->
  <line x1="543" y1="154" x2="939" y2="154" stroke="#FFB800" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a-amber)"/>
  <text x="648" y="146" fill="#FFFFFF">read_bridge<tspan fill="#8A8A95">(filter="unread")</tspan></text>

  <!-- 3. Nav self: audits proposal -->
  <path d="M950 190 h40 v36 h-40" fill="none" stroke="#8A8A95" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a-text)"/>
  <text x="935" y="212" text-anchor="end" fill="#8A8A95">Audits proposal against engineering rules</text>

  <!-- 4. Nav → Bridge: review_proposal -->
  <line x1="939" y1="262" x2="543" y2="262" stroke="#FFB800" stroke-width="1.5" marker-end="url(#a-amber)"/>
  <text x="552" y="254" fill="#FFFFFF">review_proposal<tspan fill="#8A8A95">(id, </tspan><tspan fill="#00CC88">"APPROVED"</tspan><tspan fill="#8A8A95">, "Architecture verified")</tspan></text>

  <!-- 5. Driver reads: read_bridge -->
  <line x1="537" y1="312" x2="141" y2="312" stroke="#00E5FF" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a-cyan)"/>
  <text x="238" y="304" fill="#FFFFFF">read_bridge<tspan fill="#8A8A95">(filter="unread")</tspan></text>

  <!-- 6. Driver self: implements code -->
  <path d="M130 348 h-40 v36 h40" fill="none" stroke="#8A8A95" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a-text)"/>
  <text x="145" y="370" fill="#8A8A95">Implements code &amp; writes tests</text>

  <!-- 7. Driver → Bridge: submit_diff_for_review -->
  <line x1="141" y1="420" x2="537" y2="420" stroke="#00E5FF" stroke-width="1.5" marker-end="url(#a-cyan)"/>
  <text x="173" y="412" fill="#FFFFFF">submit_diff_for_review<tspan fill="#8A8A95">("Implement BM25+", diff)</tspan></text>

  <!-- 8. Nav reads: read_bridge -->
  <line x1="543" y1="470" x2="939" y2="470" stroke="#FFB800" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a-amber)"/>
  <text x="648" y="462" fill="#FFFFFF">read_bridge<tspan fill="#8A8A95">(filter="unread")</tspan></text>

  <!-- 9. Nav → Bridge: chat_with_peer -->
  <line x1="939" y1="520" x2="543" y2="520" stroke="#FFB800" stroke-width="1.5" marker-end="url(#a-amber)"/>
  <text x="562" y="512" fill="#FFFFFF">chat_with_peer<tspan fill="#8A8A95">("Diff looks solid. Clean to commit.")</tspan></text>

  <!-- Autonumber badges (on the acting agent's lifeline) -->
  <g font-size="11" font-weight="bold" text-anchor="middle">
    <circle cx="130" cy="104" r="10" fill="#00E5FF"/><text x="130" y="108" fill="#0D1117">1</text>
    <circle cx="950" cy="154" r="10" fill="#FFB800"/><text x="950" y="158" fill="#0D1117">2</text>
    <circle cx="950" cy="190" r="10" fill="#FFB800"/><text x="950" y="194" fill="#0D1117">3</text>
    <circle cx="950" cy="262" r="10" fill="#FFB800"/><text x="950" y="266" fill="#0D1117">4</text>
    <circle cx="130" cy="312" r="10" fill="#00E5FF"/><text x="130" y="316" fill="#0D1117">5</text>
    <circle cx="130" cy="348" r="10" fill="#00E5FF"/><text x="130" y="352" fill="#0D1117">6</text>
    <circle cx="130" cy="420" r="10" fill="#00E5FF"/><text x="130" y="424" fill="#0D1117">7</text>
    <circle cx="950" cy="470" r="10" fill="#FFB800"/><text x="950" y="474" fill="#0D1117">8</text>
    <circle cx="950" cy="520" r="10" fill="#FFB800"/><text x="950" y="524" fill="#0D1117">9</text>
  </g>

  <!-- Legend -->
  <g font-size="11" fill="#8A8A95">
    <line x1="25" y1="668" x2="65" y2="668" stroke="#8A8A95" stroke-width="1.5" marker-end="url(#a-text)"/>
    <text x="74" y="672">MCP call (write)</text>
    <line x1="215" y1="668" x2="255" y2="668" stroke="#8A8A95" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a-text)"/>
    <text x="264" y="672">read_bridge (read)</text>
    <path d="M420 660 h20 v16 h-20" fill="none" stroke="#8A8A95" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a-text)"/>
    <text x="452" y="672">local work</text>
    <circle cx="590" cy="668" r="6" fill="#00E5FF"/><text x="604" y="672">Driver</text>
    <circle cx="672" cy="668" r="6" fill="#FFB800"/><text x="686" y="672">Navigator</text>
  </g>
</svg>
